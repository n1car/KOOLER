services:
  postgres:
    image: postgres:17-alpine
    container_name: kooler-db
    restart: unless-stopped
    ports:
      - 5433:5432
    environment:
      POSTGRES_DB: kooler_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - kooler_data:/var/lib/postgresql/data

volumes:
  kooler_data:
