# Blueprint de despliegue para Render (https://render.com/docs/blueprint-spec).
#
# Publica el backend (imagen Docker del Dockerfile) y lo conecta a una base de
# datos PostgreSQL externa en Neon. Las credenciales de Neon se completan en el
# panel de Render (sync: false) y nunca viajan en el repositorio.
#
# Uso: Render Dashboard -> New -> Blueprint -> seleccionar este repositorio.

services:
  - type: web
    name: kooler-api
    runtime: docker
    plan: free
    region: oregon
    branch: dev
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      # Neon: pegue la URL directa (sin -pooler) en el panel de Render.
      # Si solo tiene la URL pooled, use DATABASE_URL en lugar de esta.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: DB_SSL
        value: "true"
